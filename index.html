<!DOCTYPE html>
<html>
<head>
<style>
    body { background: #0f0f0f; color: #eee; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
    #container { width: 100%; max-width: 600px; }
    #chat { height: 400px; border: 1px solid #333; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #1a1a1a; }
    input, textarea, button { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #444; }
    button { background: #0055ff; border: none; cursor: pointer; }
</style>
</head>
<body>

<div id="container">
    <input type="password" id="key" placeholder="Enter your OpenRouter API Key">
    <div id="chat"></div>
    <textarea id="prompt" placeholder="Ask Auka..."></textarea>
    <button onclick="send()">Send Request</button>
</div>

<script>
async function send() {
    const key = document.getElementById('key').value;
    const prompt = document.getElementById('prompt').value;
    const chat = document.getElementById('chat');
    
    chat.innerHTML += `<div><b>You:</b> ${prompt}</div>`;
    
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            model: "openai/gpt-oss-120b:free",
            messages: [{ role: "user", content: prompt }]
        })
    });
    
    const data = await res.json();
    chat.innerHTML += `<div><b>Auka:</b> ${data.choices[0].message.content}</div>`;
}
</script>
</body>
</html>
