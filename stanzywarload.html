<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STANZY WARLOAD // LOGS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 0 !important;
        }

        body {
            background-color: #000000;
            background-image: url('https://wallpapercave.com/wp/0Xf6Hpa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            padding: 20px;
        }

        .layout-grid {
            max-width: 1000px;
            margin: 0 auto;
            background: #000000;
            border: 2px solid #ffffff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        /* Banner Container */
        .banner-container {
            width: 100%;
            border-bottom: 2px solid #ffffff;
            overflow: hidden;
        }
        .banner-img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        /* Tactical Header Block */
        .site-header {
            padding: 20px 40px;
            border-bottom: 2px solid #ffffff;
            background: #0a0a0a;
        }
        .site-header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .site-header .ticker {
            font-size: 0.85rem;
            color: #ff3333;
            margin-top: 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Main Content Feed */
        .news-feed {
            padding: 40px;
        }

        .news-item {
            border: 1px solid #ffffff;
            background: #0a0a0a;
            margin-bottom: 30px;
            padding: 25px;
        }

        .news-meta {
            font-size: 0.85rem;
            color: #aaaaaa;
            margin-bottom: 10px;
            border-bottom: 1px dashed #444444;
            padding-bottom: 5px;
        }

        .news-title {
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .news-content p {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #dddddd;
        }
        .news-content p:last-child {
            margin-bottom: 0;
        }

        /* Return Link */
        .nav-footer {
            padding: 0 40px 40px 40px;
        }
        .back-btn {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #ffffff;
            padding: 10px 20px;
        }
        .back-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        @media (max-width: 700px) {
            .site-header, .news-feed, .nav-footer { padding: 20px; }
            .site-header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div class="layout-grid">
        <!-- Main Banner -->
        <div class="banner-container">
            <img src="https://lens.usercontent.google.com/image?vsrid=CL6SqfGw39jURRACGAEiJDM5NDY2Zjg2LTc1OGYtNGVhMi04OGE2LTJiZjZiMzQ3NzY1NTKBASICZ2goB0JzCi5sZmUtZHVtbXk6YzQzOGM2ZmItMWJjZC00YzY4LWE4OWMtYzFlZDE2MmIzOWUyEkEKPy9ibnMvZ2gvYm9yZy9naC9ibnMvbGVucy1mcm9udGVuZC1hcGkvcHJvZC5sZW5zLWZyb250ZW5kLWFwaS82N1oECgJnaDjHpqfYw92VAw&gsessionid=99jokZNr6ebYs2EuKb8uUAkE6W58sQiVMPMJLmMOjjXafb0rm06yvA" alt="Stanzy Warload Banner" class="banner-img">
        </div>

        <!-- News Terminal Header -->
        <header class="site-header">
            <h1>Stanzy Warload Intel Feed</h1>
            <div class="ticker">STATUS: SOLAR SYSTEM LOCKDOWN COMPLIANCE // ACTIVE ARCHIVE TRANSMISSIONS</div>
        </header>

        <!-- Dynamic News Feed Area -->
        <main class="news-feed" id="newsFeed">
            <!-- JavaScript will inject your custom news posts straight into here -->
        </main>

        <footer class="nav-footer">
            <a href="index.html" class="back-btn">&lt; RETURN TO CORE</a>
        </footer>
    </div>

    <script>
        // ==========================================
        //  DEFINE YOUR NEWSLETTERS HERE
        //  Just add or edit objects in this array.
        // ==========================================
        const newsArticles = [
            {
                date: "2097-07-18",
                title: "USG Agreement Bypassed Near Mars Sector",
                paragraphs: [
                    "The United Space Governance has intensified defensive barriers across Sol. Reports indicate the Mars superweapon data tracking arrays remain online despite atmosphere dissipation.",
                    "Citizens trying to break the quarantine protocol face direct laser alignment grids. Operational groups are mobilizing to counter extreme tactical deployment schemes."
                ]
            },
        ];

        // ==========================================
        //  ENGINE RENDERING CODE (DO NOT EDIT)
        // ==========================================
        const feedContainer = document.getElementById('newsFeed');
        
        newsArticles.forEach(article => {
            const articleElement = document.createElement('article');
            articleElement.className = 'news-item';
            
            let paragraphHTML = '';
            article.paragraphs.forEach(text => {
                paragraphHTML += `<p>${text}</p>`;
            });

            articleElement.innerHTML = `
                <div class="news-meta">LOG_DATE: ${article.date} // TERMINAL_READOUT</div>
                <div class="news-title">${article.title}</div>
                <div class="news-content">
                    ${paragraphHTML}
                </div>
            `;
            
            feedContainer.appendChild(articleElement);
        });
    </script>
</body>
</html>
