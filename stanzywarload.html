<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanzy Warload - Dev Blog & News</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            border-radius: 0 !important;
        }

        body {
            background-color: #000000;
            background-image: url('https://wallpapercave.com/wp/0Xf6Hpa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            padding: 20px;
        }

        .layout-grid {
            max-width: 900px;
            margin: 0 auto;
            background: #000000;
            border: 2px solid #ffffff;
        }

        /* Banner Container */
        .banner-container {
            width: 100%;
            border-bottom: 2px solid #ffffff;
            overflow: hidden;
        }
        .banner-img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        /* Main Site Title */
        .site-header {
            padding: 30px 40px;
            border-bottom: 2px solid #ffffff;
            background: #0a0a0a;
        }
        .site-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
        }
        .site-header p {
            font-size: 1rem;
            color: #888888;
            margin-top: 5px;
        }

        /* News Layout */
        .news-feed {
            padding: 40px;
        }

        .news-item {
            margin-bottom: 50px;
        }
        .news-item:last-child {
            margin-bottom: 0;
        }

        .news-date {
            font-size: 0.9rem;
            color: #888888;
            margin-bottom: 8px;
        }

        .news-title {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .news-content p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #cccccc;
        }
        .news-content p:last-child {
            margin-bottom: 0;
        }

        /* Footer Link */
        .nav-footer {
            padding: 0 40px 40px 40px;
        }
        .back-btn {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #ffffff;
            padding: 10px 20px;
        }
        .back-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        @media (max-width: 700px) {
            .site-header, .news-feed, .nav-footer { padding: 20px; }
            .site-header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="layout-grid">
        <!-- Main Banner -->
        <div class="banner-container">
            <img src="https://lens.usercontent.google.com/image?vsrid=CL6SqfGw39jURRACGAEiJDM5NDY2Zjg2LTc1OGYtNGVhMi04OGE2LTJiZjZiMzQ3NzY1NTKBASICZ2goB0JzCi5sZmUtZHVtbXk6YzQzOGM2ZmItMWJjZC00YzY4LWE4OWMtYzFlZDE2MmIzOWUyEkEKPy9ibnMvZ2gvYm9yZy9naC9ibnMvbGVucy1mcm9udGVuZC1hcGkvcHJvZC5sZW5zLWZyb250ZW5kLWFwaS82N1oECgJnaDjHpqfYw92VAw&gsessionid=99jokZNr6ebYs2EuKb8uUAkE6W58sQiVMPMJLmMOjjXafb0rm06yvA" alt="Stanzy Warload Banner" class="banner-img">
        </div>

        <!-- News Header -->
        <header class="site-header">
            <h1>Stanzy Warload News</h1>
            <p>Official development updates, lore summaries, and universe changes.</p>
        </header>

        <!-- News Articles -->
        <main class="news-feed" id="newsFeed">
            <!-- JavaScript injects articles here -->
        </main>

        <footer class="nav-footer">
            <a href="index.html" class="back-btn">Return to Portfolio</a>
        </footer>
    </div>

    <script>
        // ==========================================
        //  ADD YOUR NEWS POSTS HERE
        // ==========================================
        const newsArticles = [
            {
                date: "July 18, 2026",
                title: "Sol System Conflict Overview",
                paragraphs: [
                    "The story started back around 2134 when the Starship launched for its 35th flight. A project known as Hue was signed between the USG and the USA, which eventually led to a superweapon deployment on Mars.",
                    "With Mars completely devastated and losing its atmosphere, panic has completely shut down the SpaceFlight Program. Citizens trying to escape Earth have locked down the Sol system entirely due to ongoing conflict, leaving players to figure out how to restore universal peace."
                ]
            },
            {
                date: "June 20, 2026",
                title: "Game Architecture Decisions",
                paragraphs: [
                    "We are building out the scale of the universe. To keep things running smoothly without major performance drops, the core game mechanics are being structured to handle massive player presence and fluid planet-to-space transitions."
                ]
            }
        ];

        // ==========================================
        //  RENDER FEED
        // ==========================================
        const feedContainer = document.getElementById('newsFeed');
        
        newsArticles.forEach((article, index) => {
            const articleElement = document.createElement('article');
            articleElement.className = 'news-item';
            
            let paragraphHTML = '';
            article.paragraphs.forEach(text => {
                paragraphHTML += `<p>${text}</p>`;
            });

            articleElement.innerHTML = `
                <div class="news-date">${article.date}</div>
                <div class="news-title">${article.title}</div>
                <div class="news-content">
                    ${paragraphHTML}
                </div>
            `;
            
            feedContainer.appendChild(articleElement);

            // Add a clean visual dividing line between posts, except for the last one
            if (index < newsArticles.length - 1) {
                const hr = document.createElement('hr');
                hr.style.border = 'none';
                hr.style.borderTop = '1px solid #333333';
                hr.style.margin = '40px 0';
                feedContainer.appendChild(hr);
            }
        });
    </script>
</body>
</html>
