<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol System News Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            border-radius: 0 !important;
        }

        body {
            background-color: #000000;
            background-image: url('https://wallpapercave.com/wp/0Xf6Hpa.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            padding: 20px;
        }

        .layout-grid {
            max-width: 900px;
            margin: 0 auto;
            background: #000000;
            border: 2px solid #ffffff;
        }

        /* Banner Container */
        .banner-container {
            width: 100%;
            border-bottom: 2px solid #ffffff;
            overflow: hidden;
        }
        .banner-img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        /* Main Site Title */
        .site-header {
            padding: 30px 40px;
            border-bottom: 2px solid #ffffff;
            background: #0a0a0a;
        }
        .site-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
        }
        .site-header p {
            font-size: 1rem;
            color: #ff3333;
            margin-top: 5px;
            font-weight: bold;
        }

        /* News Layout */
        .news-feed {
            padding: 40px;
        }

        .news-item {
            margin-bottom: 50px;
        }
        .news-item:last-child {
            margin-bottom: 0;
        }

        .news-date {
            font-size: 0.9rem;
            color: #888888;
            margin-bottom: 8px;
        }

        .news-title {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .news-content p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #cccccc;
        }
        .news-content p:last-child {
            margin-bottom: 0;
        }

        /* Footer Link */
        .nav-footer {
            padding: 0 40px 40px 40px;
        }
        .back-btn {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #ffffff;
            padding: 10px 20px;
        }
        .back-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        @media (max-width: 700px) {
            .site-header, .news-feed, .nav-footer { padding: 20px; }
            .site-header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="layout-grid">
        <!-- Main Banner -->
        <div class="banner-container">
            <img src="https://lens.usercontent.google.com/image?vsrid=CL6SqfGw39jURRACGAEiJDM5NDY2Zjg2LTc1OGYtNGVhMi04OGE2LTJiZjZiMzQ3NzY1NTKBASICZ2goB0JzCi5sZmUtZHVtbXk6YzQzOGM2ZmItMWJjZC00YzY4LWE4OWMtYzFlZDE2MmIzOWUyEkEKPy9ibnMvZ2gvYm9yZy9naC9ibnMvbGVucy1mcm9udGVuZC1hcGkvcHJvZC5sZW5zLWZyb250ZW5kLWFwaS82N1oECgJnaDjHpqfYw92VAw&gsessionid=99jokZNr6ebYs2EuKb8uUAkE6W58sQiVMPMJLmMOjjXafb0rm06yvA" alt="Stanzy Warload Banner" class="banner-img">
        </div>

        <!-- News Header -->
        <header class="site-header">
            <h1>Sol System News Network</h1>
            <p>CRITICAL UPDATES: USG QUARANTINE STATUS & INTERSTELLAR REPORTS</p>
        </header>

        <!-- News Articles -->
        <main class="news-feed" id="newsFeed">
            <!-- JavaScript injects articles here -->
        </main>

        <footer class="nav-footer">
            <a href="index.html" class="back-btn">Return to Portfolio</a>
        </footer>
    </div>

    <script>
        // ==========================================
        //  ADD YOUR NEWS POSTS HERE
        // ==========================================
        const newsArticles = [
            {
                date: "October 14, 2134",
                title: "Sol System Placed Under Absolute Lockdown Following Mars Destruction",
                paragraphs: [
                    "The United Space Governance (USG) has declared an immediate, system-wide lockdown across Sol. The containment protocol follows the catastrophic destruction of Mars, which has completely lost its atmosphere after the deployment of the 'Hue' project superweapon.",
                    "Public panic is rising as citizens accuse the USG of attempting to suppress data collected by the weapon's planetary laser systems. In response to the growing chaos and reports of retaliation threats against the Sun, the SpaceFlight Program has been officially cancelled indefinitely."
                ]
            },
            {
                date: "August 2, 2134",
                title: "USG and USA Finalize Secret 'Hue' Agreement",
                paragraphs: [
                    "Documents leaked today confirm the United Space Governance has officially signed a collaborative contract with the United States of America under the codename Project Hue.",
                    "While details remain classified, the operation is heavily tied to the upcoming 35th launch of the flagship Starship array. Independent planetary analysts warn that the project involves deep-space energy tracking grids centered around the Mars sector."
                ]
            }
        ];

        // ==========================================
        //  RENDER FEED
        // ==========================================
        const feedContainer = document.getElementById('newsFeed');
        
        newsArticles.forEach((article, index) => {
            const articleElement = document.createElement('article');
            articleElement.className = 'news-item';
            
            let paragraphHTML = '';
            article.paragraphs.forEach(text => {
                paragraphHTML += `<p>${text}</p>`;
            });

            articleElement.innerHTML = `
                <div class="news-date">${article.date}</div>
                <div class="news-title">${article.title}</div>
                <div class="news-content">
                    ${paragraphHTML}
                </div>
            `;
            
            feedContainer.appendChild(articleElement);

            if (index < newsArticles.length - 1) {
                const hr = document.createElement('hr');
                hr.style.border = 'none';
                hr.style.borderTop = '1px solid #333333';
                hr.style.margin = '40px 0';
                feedContainer.appendChild(hr);
            }
        });
    </script>
</body>
</html>
